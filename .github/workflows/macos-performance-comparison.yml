name: macOS Performance Comparison

on:
  workflow_dispatch:
  push:
    branches:
      - seil-update

permissions:
  contents: read

concurrency:
  group: macos-performance-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Flutter 3.44.6
        run: |
          git clone --depth 1 --branch 3.44.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          flutter config --enable-macos-desktop
          flutter precache --macos

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build previous-behavior test DMG
        run: SEIL_PERFORMANCE_VARIANT=previous ./scripts/build-macos-dmg.sh

      - name: Build current-behavior test DMG
        run: SEIL_PERFORMANCE_VARIANT=current ./scripts/build-macos-dmg.sh

      - name: Upload comparison DMGs
        uses: actions/upload-artifact@v7
        with:
          name: SEIL-macOS-Performance-Comparison
          path: |
            release/macos/*-previous-test.dmg
            release/macos/*-current-test.dmg
          if-no-files-found: error
          retention-days: 14
